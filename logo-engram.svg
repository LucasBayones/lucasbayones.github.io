<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 920" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="62%" fx="54%" fy="36%">
      <stop offset="0%" stop-color="#0D2538" />
      <stop offset="55%" stop-color="#081723" />
      <stop offset="100%" stop-color="#050E16" />
    </radialGradient>
    <radialGradient id="coreHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.78" />
      <stop offset="35%" stop-color="#2563EB" stop-opacity="0.40" />
      <stop offset="70%" stop-color="#1D4ED8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coreCenter" cx="42%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="38%" stop-color="#38F2FF" />
      <stop offset="82%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </radialGradient>
    <linearGradient id="gradRibbonMain" x1="8%" y1="50%" x2="92%" y2="50%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="28%" stop-color="#38BDF8" />
      <stop offset="52%" stop-color="#2DD4BF" />
      <stop offset="78%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="gradRibbonSecondary" x1="5%" y1="30%" x2="95%" y2="70%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="68%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="gradCenterBridge" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="gradBracket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="35%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7.5" result="blur1" />
      <feGaussianBlur stdDeviation="2.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

